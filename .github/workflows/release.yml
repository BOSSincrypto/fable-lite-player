name: Release APK

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'CHANGELOG.md'
      - '.github/**'
      - 'docs/**'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Extract version from gradle
        id: get_version
        run: |
          VERSION_NAME=$(grep 'versionName' app/build.gradle.kts | cut -d'"' -f2)
          VERSION_CODE=$(grep 'versionCode' app/build.gradle.kts | grep -o '[0-9]\+' | head -1)
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "Version: $VERSION_NAME ($VERSION_CODE)"

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Rename APK
        run: |
          mkdir -p app/build/outputs/apk/release
          ls -la app/build/outputs/apk/release/
          mv app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/apk/release/fable-lite-player-v${{ steps.get_version.outputs.version_name }}.apk

      - name: Check if tag exists
        id: check_tag
        run: |
          if git rev-parse "v${{ steps.get_version.outputs.version_name }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        if: steps.check_tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.get_version.outputs.version_name }}
          name: Fable Lite Player v${{ steps.get_version.outputs.version_name }}
          body: |
            ## What's Changed

            Release of Fable Lite Player v${{ steps.get_version.outputs.version_name }}

            ### Features
            - ⚡ Ultra-fast video playback with zero-lag optimization
            - 🎬 Hardware-accelerated ExoPlayer integration
            - 📱 Picture-in-Picture (PiP) mode
            - 👆 Intuitive gesture controls (swipe for seek/volume/brightness)
            - 🎯 Variable playback speed (0.25x - 2.0x)
            - 🎨 Modern Material Design 3 UI with Jetpack Compose

            ### Performance
            - Min SDK: Android 10 (API 29)
            - Target SDK: Android 15 (API 35)
            - APK Size: ~8MB
            - RAM Usage: 35-50MB during playback

            ### Installation
            Download the APK below and install on your Android device.

            **Build:** ${{ steps.get_version.outputs.version_code }}
            **Commit:** ${{ github.sha }}

            ---

            For detailed changes, see [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)
          files: app/build/outputs/apk/release/fable-lite-player-v${{ steps.get_version.outputs.version_name }}.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
